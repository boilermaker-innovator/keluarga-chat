# One Worker serves both the page (site/) and the translate API (/api/*).
# Deploy from the repo root with: npx wrangler deploy
name = "keluarga-chat-worker"
main = "worker/src/index.js"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./site"
binding = "ASSETS"
# /api/* and /webhook go to the Worker code; everything else is served from site/.
run_worker_first = ["/api/*", "/webhook"]

[vars]
# Page addresses allowed to call the API, comma-separated, no trailing slash.
# Requests from the Worker's own address are always allowed.
ALLOWED_ORIGINS = "https://keluarga-chat-worker.jgwynne7.workers.dev,https://keluarga-chat.pages.dev"

# Per-IP limit: 20 translations a minute is plenty for one person.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 20
  period = 60

# Received WhatsApp messages (with their English translations).
# No id on purpose: on the first deploy Wrangler creates the KV namespace
# automatically and links it here. If you'd rather create it yourself, make
# a namespace in the dashboard and add its id:  id = "<namespace id>"
[[kv_namespaces]]
binding = "INBOX"
